services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xywtest
      POSTGRES_PASSWORD: xyw_!*!_242523
      POSTGRES_DB: xywtest_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xywtest -d xywtest_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "123456"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: node:24.18.0-slim
    restart: unless-stopped
    ports:
      - "8890:8890"
    volumes:
      - ./server/dist:/app
      - ./logs:/xyw/logs/xywtest
    working_dir: /app
    environment:
      NODE_ENV: production
      LOG_DIR: /xyw/logs/xywtest
      HOST: 0.0.0.0
      PORT: "8890"
      PRISMA_ENGINES_MIRROR: "https://registry.npmmirror.com/-/binary/prisma"
      DATABASE_URL: "postgresql://xywtest:xyw_!*!_242523@postgres:5432/xywtest_db?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "123456"
      JWT_SECRET: "syu/gAiH1rqn4X3nNoJpNNPgzjbprpNC+UMo3zdoiq6NyOwfDGyGXCgO+WMt0ZPK"
      ENABLE_CRON: "true"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: files
      SUPER_ADMIN_USERNAME: "${SUPER_ADMIN_USERNAME:-admin}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:-admin123}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8890/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    command: >
      sh -c "
        sed -i 's|deb.debian.org|mirrors.aliyun.com|g' /etc/apt/sources.list.d/debian.sources 2>/dev/null;
        sed -i 's|deb.debian.org|mirrors.aliyun.com|g' /etc/apt/sources.list 2>/dev/null;
        apt-get update &&
        apt-get install -y --no-install-recommends openssl ca-certificates curl &&
        rm -rf /var/lib/apt/lists/* &&
        export COREPACK_NPM_REGISTRY=https://registry.npmmirror.com &&
        corepack enable && corepack prepare pnpm@9.15.0 --activate &&
        pnpm install --production --no-frozen-lockfile --registry=https://registry.npmmirror.com &&
        pnpm run prisma:generate &&
        pnpm run prisma:migrate &&
        pnpm start
      "

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8890"
      # 只替换 BACKEND_* 开头的变量，保留 nginx 自带的 $host/$remote_addr/$uri 等
      NGINX_ENVSUBST_FILTER: "BACKEND"
    volumes:
      # 本地构建好的静态产物直接挂入 nginx 静态目录
      - ./manage-ui-react/dist:/usr/share/nginx/html:ro
      # nginx 站点配置：放到 templates/ 下，nginx 镜像启动时用 envsubst 替换环境变量
      - ./manage-ui-react/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - backend

volumes:
  pg_data:
  redis_data:
  minio_data: